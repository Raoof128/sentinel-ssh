[package]
name = "sentinel-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
regex = "1.13.1"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io", "macros", "schemars"] }
rustix = { version = "1.1.5", features = ["process", "fs"] }
schemars = { version = "1.2.3", features = ["chrono04"] }
sentinel-core = { version = "0.1.0", path = "../sentinel-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "fs", "sync", "time"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "sentinel-ssh"
path = "src/main.rs"

[dev-dependencies]
futures = "0.3.34"
hex = "0.4.3"
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"
regex = "1.13.1"
sentinel-testkit = { path = "../sentinel-testkit" }
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util", "rt-multi-thread", "macros"] }
