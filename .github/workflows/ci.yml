name: CI

# The quick gate: formatting, clippy with warnings as errors, the unsafe-code, secret and flag-literal scans,
# the tool-contract freshness check, and the unit and contract tests. The full gate (Docker sshd fixture,
# end-to-end and red-team suites, 100% product line coverage) is `bash scripts/check.sh` and runs locally.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-gate:
    name: Quick gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install || rustup show

      - name: Run the quick gate
        run: bash scripts/check.sh --quick
