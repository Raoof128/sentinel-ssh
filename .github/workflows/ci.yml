name: CI

# Two jobs. The quick gate: formatting, clippy with warnings as errors, the unsafe-code, secret and
# flag-literal scans, the tool-contract freshness check, and the unit and contract tests. The full gate:
# the Docker sshd fixture, the end-to-end and red-team suites, and 100% product line coverage.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Several tests write a fake `ssh` script and then execute it. On Linux, if another test thread forks
# while that script is still open for writing, the exec fails with ETXTBSY ("Text file busy"). Running
# each test binary on one thread removes the race; the suites take under a minute either way.
env:
  RUST_TEST_THREADS: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-gate:
    name: Quick gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install || rustup show

      - name: Run the quick gate
        run: bash scripts/check.sh --quick

  full-gate:
    name: Full gate (fixture, e2e, red-team, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install || rustup show
          rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run the full gate
        run: bash scripts/check.sh
